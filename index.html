<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        font-family: Arial, sans-serif;
      }

      .calculator {
        width: 320px;
        background: #111827;
        border-radius: 18px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }

      .display {
        background: #0b1220;
        color: #f8fafc;
        min-height: 120px;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 20px;
        font-size: 2rem;
        word-break: break-all;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 18px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 18px 0;
        font-size: 1.2rem;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.12s ease;
      }

      button:hover {
        opacity: 0.92;
      }

      button:active {
        transform: scale(0.98);
      }

      .operator {
        background: #f59e0b;
        color: #fff;
      }

      .number {
        background: #e5e7eb;
        color: #111827;
      }

      .special {
        background: #94a3b8;
        color: #0f172a;
      }

      .zero {
        grid-column: span 2;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <div id="display" class="display">0</div>
      <div class="buttons">
        <button class="special" onclick="clearDisplay()">C</button>
        <button class="special" onclick="deleteLast()">DEL</button>
        <button class="special" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <button class="number" onclick="appendValue('7')">7</button>
        <button class="number" onclick="appendValue('8')">8</button>
        <button class="number" onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button class="number" onclick="appendValue('4')">4</button>
        <button class="number" onclick="appendValue('5')">5</button>
        <button class="number" onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button class="number" onclick="appendValue('1')">1</button>
        <button class="number" onclick="appendValue('2')">2</button>
        <button class="number" onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button class="number zero" onclick="appendValue('0')">0</button>
        <button class="number" onclick="appendValue('.')">.</button>
        <button class="operator" onclick="calculate()">=</button>
      </div>
    </div>

    <script>
      const display = document.getElementById('display');
      let expression = '0';

      function updateDisplay() {
        display.textContent = expression;
      }

      function clearDisplay() {
        expression = '0';
        updateDisplay();
      }

      function deleteLast() {
        if (expression.length <= 1) {
          expression = '0';
        } else {
          expression = expression.slice(0, -1);
        }
        updateDisplay();
      }

      function appendValue(value) {
        if (expression === '0' && !['.', '+', '-', '*', '/'].includes(value)) {
          expression = value;
        } else if (value === '%' && expression !== '0') {
          expression = String((Number(expression) / 100));
        } else {
          expression += value;
        }

        updateDisplay();
      }

      function calculate() {
        try {
          const result = Function(`"use strict"; return (${expression})`)();
          expression = Number.isFinite(result) ? String(result) : 'Error';
        } catch {
          expression = 'Error';
        }
        updateDisplay();
      }

      updateDisplay();
    </script>
  </body>
</html>
